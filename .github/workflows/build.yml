name: Build and Push to GitHub Container Registry

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  REGISTRY: ghcr.io

jobs:
  # Integration tests use TestContainers (a real Postgres in Docker), so they cannot run inside the
  # image build (no Docker-in-Docker). They run here on the runner, where Docker is available, and
  # gate the image build below. Lint, build and unit tests run inside the Dockerfile.
  integration_tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Integration tests
      run: npm run test:int

  build:
    needs: integration_tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Setup buildx
      uses: docker/setup-buildx-action@v3

    # The registry requires lower case names, the metadata action takes care of that.
    - name: Calculate tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.run_number }},enable={{is_default_branch}}
          type=sha

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Pull requests only build the image to verify it, pushes to main publish it.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
