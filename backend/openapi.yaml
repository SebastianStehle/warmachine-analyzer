openapi: 3.0.0
paths:
  /api/events:
    get:
      description: Gets imported events.
      operationId: getEvents
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: The zero based page.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: The number of items per page.
          schema:
            type: number
        - name: search
          required: false
          in: query
          description: Case insensitive text search.
          schema:
            type: string
        - name: order
          required: false
          in: query
          description: The sort direction.
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: sort
          required: false
          in: query
          description: The field to sort by.
          schema:
            $ref: "#/components/schemas/EventSortField"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsDto"
      summary: ""
      tags:
        - events
  /api/events/{id}:
    get:
      description: Gets an event with standings.
      operationId: getEvent
      parameters:
        - name: id
          required: true
          in: path
          description: The Longshanks ID of the event.
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailsDto"
      summary: ""
      tags:
        - events
  /api/lists:
    get:
      description: Gets lists, newest first.
      operationId: getLists
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: The zero based page.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: The number of items per page.
          schema:
            type: number
        - name: search
          required: false
          in: query
          description: Case insensitive text search.
          schema:
            type: string
        - name: order
          required: false
          in: query
          description: The sort direction.
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: sort
          required: false
          in: query
          description: The field to sort by.
          schema:
            $ref: "#/components/schemas/ListSortField"
        - name: playerId
          required: false
          in: query
          description: Only lists of this player.
          schema:
            type: number
        - name: eventId
          required: false
          in: query
          description: Only lists of this event.
          schema:
            type: number
        - name: army
          required: false
          in: query
          description: Only lists of these armies.
          schema:
            type: array
            items:
              type: string
        - name: caster
          required: false
          in: query
          description: Only lists with one of these casters.
          schema:
            type: array
            items:
              type: string
        - name: pointLevel
          required: false
          in: query
          description: Only lists for these point levels.
          schema:
            type: array
            items:
              type: number
        - name: maxRank
          required: false
          in: query
          description: Only lists of players who placed at this rank or better.
          schema:
            type: number
        - name: unit
          required: false
          in: query
          description: Only lists containing this model or unit.
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListsDto"
      summary: ""
      tags:
        - lists
  /api/lists/casters:
    get:
      description: Gets the casters of the lists.
      operationId: getCasters
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
        - name: army
          required: false
          in: query
          description: Only casters of these armies.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasterOptionsDto"
      summary: ""
      tags:
        - lists
  /api/lists/point-levels:
    get:
      description: Gets the point levels of the lists.
      operationId: getPointLevels
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointLevelOptionsDto"
      summary: ""
      tags:
        - lists
  /api/lists/prices:
    post:
      description: Calculates the prices of lists without the products that are
        already owned.
      operationId: getListPrices
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListPricesRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPricesDto"
      summary: ""
      tags:
        - lists
  /api/lists/{id}:
    get:
      description: Gets a list with entries and games.
      operationId: getList
      parameters:
        - name: id
          required: true
          in: path
          description: The ID of the list.
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDetailsDto"
      summary: ""
      tags:
        - lists
  /api/players:
    get:
      description: Gets players with their results.
      operationId: getPlayers
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: The zero based page.
          schema:
            type: number
        - name: pageSize
          required: false
          in: query
          description: The number of items per page.
          schema:
            type: number
        - name: search
          required: false
          in: query
          description: Case insensitive text search.
          schema:
            type: string
        - name: order
          required: false
          in: query
          description: The sort direction.
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: sort
          required: false
          in: query
          description: The field to sort by.
          schema:
            $ref: "#/components/schemas/PlayerSortField"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersDto"
      summary: ""
      tags:
        - players
  /api/players/{id}:
    get:
      description: Gets a player with all events.
      operationId: getPlayer
      parameters:
        - name: id
          required: true
          in: path
          description: The Longshanks ID of the player.
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetailsDto"
      summary: ""
      tags:
        - players
  /api/shop/products:
    get:
      description: Gets the products of the shop that contain models.
      operationId: getShopProducts
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductsDto"
      summary: ""
      tags:
        - shop
  /api/stats/factions:
    get:
      description: Gets stats per army.
      operationId: getFactionStats
      parameters:
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactionStatsListDto"
      summary: ""
      tags:
        - stats
  /api/stats/factions/{army}:
    get:
      description: Gets casters, units and matchups of an army.
      operationId: getFactionDetails
      parameters:
        - name: army
          required: true
          in: path
          description: The army as named by Longshanks.
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Only include events on or after this date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Only include events on or before this date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactionDetailsDto"
      summary: ""
      tags:
        - stats
info:
  title: Warmachine Analyzer
  description: Meta analysis for Warmachine lists
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  schemas:
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    EventSortField:
      type: string
      enum:
        - date
        - name
        - players
        - rounds
    EventDto:
      type: object
      properties:
        id:
          type: number
          description: The Longshanks ID of the event.
        name:
          type: string
          description: The name.
        date:
          type: string
          description: The date (YYYY-MM-DD).
        location:
          type: string
          description: The location.
          nullable: true
        type:
          type: string
          description: The event type, e.g. Rated tournament.
          nullable: true
        playerCount:
          type: number
          description: The number of players.
        rounds:
          type: number
          description: The number of rounds.
        lists:
          type: number
          description: The number of imported lists.
      required:
        - id
        - name
        - date
        - location
        - type
        - playerCount
        - rounds
        - lists
    EventsDto:
      type: object
      properties:
        items:
          description: The events.
          type: array
          items:
            $ref: "#/components/schemas/EventDto"
        total:
          type: number
          description: The total number of events.
      required:
        - items
        - total
    StandingListDto:
      type: object
      properties:
        id:
          type: number
          description: The ID of the list.
        caster:
          type: string
          description: The caster.
          nullable: true
      required:
        - id
        - caster
    EventStandingDto:
      type: object
      properties:
        rank:
          type: number
          description: The final rank.
        playerId:
          type: number
          description: The Longshanks ID of the player.
        playerName:
          type: string
          description: The name of the player.
        army:
          type: string
          description: The army.
          nullable: true
        faction:
          type: string
          description: The parent faction.
          nullable: true
        tournamentPoints:
          type: number
          description: The tournament points.
        wins:
          type: number
          description: The wins.
        losses:
          type: number
          description: The losses.
        strengthOfSchedule:
          type: number
          description: The strength of schedule.
          nullable: true
        controlPoints:
          type: number
          description: The control points.
          nullable: true
        armyPoints:
          type: number
          description: The army points.
          nullable: true
        lists:
          description: The submitted lists.
          type: array
          items:
            $ref: "#/components/schemas/StandingListDto"
      required:
        - rank
        - playerId
        - playerName
        - army
        - faction
        - tournamentPoints
        - wins
        - losses
        - strengthOfSchedule
        - controlPoints
        - armyPoints
        - lists
    EventDetailsDto:
      type: object
      properties:
        id:
          type: number
          description: The Longshanks ID of the event.
        name:
          type: string
          description: The name.
        date:
          type: string
          description: The date (YYYY-MM-DD).
        location:
          type: string
          description: The location.
          nullable: true
        type:
          type: string
          description: The event type, e.g. Rated tournament.
          nullable: true
        playerCount:
          type: number
          description: The number of players.
        rounds:
          type: number
          description: The number of rounds.
        lists:
          type: number
          description: The number of imported lists.
        standings:
          description: The final standings.
          type: array
          items:
            $ref: "#/components/schemas/EventStandingDto"
      required:
        - id
        - name
        - date
        - location
        - type
        - playerCount
        - rounds
        - lists
        - standings
    ListSortField:
      type: string
      enum:
        - date
        - event
        - player
        - rank
        - army
        - caster
        - points
        - price
    ListSummaryDto:
      type: object
      properties:
        id:
          type: number
          description: The ID of the list.
        title:
          type: string
          description: The title of the list.
        faction:
          type: string
          description: The parent faction.
          nullable: true
        army:
          type: string
          description: The army.
        caster:
          type: string
          description: The caster.
          nullable: true
        pointLevel:
          type: number
          description: The point level of the game.
          nullable: true
        totalPoints:
          type: number
          description: The total points.
          nullable: true
        price:
          type: number
          description: The price of the cheapest products that contain the models of the
            list, in cents.
          nullable: true
        currency:
          type: string
          description: The currency of the price.
          nullable: true
        eventId:
          type: number
          description: The Longshanks ID of the event.
        eventName:
          type: string
          description: The name of the event.
        eventDate:
          type: string
          description: The date of the event.
        eventPlayers:
          type: number
          description: The number of players in the event.
        playerId:
          type: number
          description: The Longshanks ID of the player.
        playerName:
          type: string
          description: The name of the player.
        rank:
          type: number
          description: The final rank in the event.
          nullable: true
        eventWins:
          type: number
          description: The wins of the player in the event.
          nullable: true
        eventLosses:
          type: number
          description: The losses of the player in the event.
          nullable: true
        games:
          type: number
          description: The games played with this list.
        wins:
          type: number
          description: The games won with this list.
      required:
        - id
        - title
        - faction
        - army
        - caster
        - pointLevel
        - totalPoints
        - price
        - currency
        - eventId
        - eventName
        - eventDate
        - eventPlayers
        - playerId
        - playerName
        - rank
        - eventWins
        - eventLosses
        - games
        - wins
    ListsDto:
      type: object
      properties:
        items:
          description: The lists.
          type: array
          items:
            $ref: "#/components/schemas/ListSummaryDto"
        total:
          type: number
          description: The total number of lists.
      required:
        - items
        - total
    CasterOptionDto:
      type: object
      properties:
        caster:
          type: string
          description: The caster.
        army:
          type: string
          description: The army.
        lists:
          type: number
          description: The number of lists with this caster.
      required:
        - caster
        - army
        - lists
    CasterOptionsDto:
      type: object
      properties:
        items:
          description: The casters.
          type: array
          items:
            $ref: "#/components/schemas/CasterOptionDto"
      required:
        - items
    PointLevelOptionDto:
      type: object
      properties:
        pointLevel:
          type: number
          description: The point level of the game.
        lists:
          type: number
          description: The number of lists for this point level.
      required:
        - pointLevel
        - lists
    PointLevelOptionsDto:
      type: object
      properties:
        items:
          description: The point levels.
          type: array
          items:
            $ref: "#/components/schemas/PointLevelOptionDto"
      required:
        - items
    OwnedProductDto:
      type: object
      properties:
        shopId:
          type: string
          description: The ID of the product in the shop.
        quantity:
          type: number
          description: How often the product is owned.
      required:
        - shopId
        - quantity
    ListPricesRequestDto:
      type: object
      properties:
        listIds:
          description: The lists to calculate the prices for.
          type: array
          items:
            type: number
        owned:
          description: The products that are already owned.
          type: array
          items:
            $ref: "#/components/schemas/OwnedProductDto"
      required:
        - listIds
        - owned
    ListProductDto:
      type: object
      properties:
        title:
          type: string
          description: The name of the product.
        url:
          type: string
          description: The link to the product in the shop.
        imageUrl:
          type: string
          description: The image of the product.
          nullable: true
        price:
          type: number
          description: The price of one product in cents.
        quantity:
          type: number
          description: How often the product is needed.
        available:
          type: boolean
          description: Whether the product can be ordered.
      required:
        - title
        - url
        - imageUrl
        - price
        - quantity
        - available
    ListPriceDto:
      type: object
      properties:
        listId:
          type: number
          description: The ID of the list.
        price:
          type: number
          description: The price of the products that are still needed, in cents.
          nullable: true
        products:
          description: The products that are still needed.
          type: array
          items:
            $ref: "#/components/schemas/ListProductDto"
      required:
        - listId
        - price
        - products
    ListPricesDto:
      type: object
      properties:
        items:
          description: The prices.
          type: array
          items:
            $ref: "#/components/schemas/ListPriceDto"
        currency:
          type: string
          description: The currency of the prices.
          nullable: true
      required:
        - items
        - currency
    ListEntryKind:
      type: string
      enum:
        - leader
        - model
        - module
      description: The kind of entry.
    ModelType:
      type: string
      enum:
        - leader
        - warjack
        - warbeast
        - battle-engine
        - solo
        - unit
        - attachment
        - structure
      description: The type of the matched model.
    ListEntryDto:
      type: object
      properties:
        name:
          type: string
          description: The name as written in the list.
        points:
          type: number
          description: The points cost.
          nullable: true
        depth:
          type: number
          description: The indentation level.
        kind:
          description: The kind of entry.
          allOf:
            - $ref: "#/components/schemas/ListEntryKind"
        modelName:
          type: string
          description: The name of the matched model in the wiki.
          nullable: true
        modelType:
          description: The type of the matched model.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ModelType"
        wikiPage:
          type: string
          description: The page of the matched model in the wiki.
          nullable: true
      required:
        - name
        - points
        - depth
        - kind
        - modelName
        - modelType
        - wikiPage
    GameResult:
      type: string
      enum:
        - win
        - loss
        - draw
      description: The result.
    ListGameDto:
      type: object
      properties:
        round:
          type: number
          description: The round.
        opponentId:
          type: number
          description: The Longshanks ID of the opponent.
          nullable: true
        scenario:
          type: string
          description: The scenario.
          nullable: true
        opponentName:
          type: string
          description: The opponent.
          nullable: true
        opponentArmy:
          type: string
          description: The army of the opponent.
          nullable: true
        opponentCaster:
          type: string
          description: The caster of the opponent.
          nullable: true
        result:
          description: The result.
          allOf:
            - $ref: "#/components/schemas/GameResult"
        controlPoints:
          type: number
          description: The control points.
          nullable: true
        armyPoints:
          type: number
          description: The army points.
          nullable: true
      required:
        - round
        - opponentId
        - scenario
        - opponentName
        - opponentArmy
        - opponentCaster
        - result
        - controlPoints
        - armyPoints
    ListDetailsDto:
      type: object
      properties:
        id:
          type: number
          description: The ID of the list.
        title:
          type: string
          description: The title of the list.
        faction:
          type: string
          description: The parent faction.
          nullable: true
        army:
          type: string
          description: The army.
        caster:
          type: string
          description: The caster.
          nullable: true
        pointLevel:
          type: number
          description: The point level of the game.
          nullable: true
        totalPoints:
          type: number
          description: The total points.
          nullable: true
        price:
          type: number
          description: The price of the cheapest products that contain the models of the
            list, in cents.
          nullable: true
        currency:
          type: string
          description: The currency of the price.
          nullable: true
        eventId:
          type: number
          description: The Longshanks ID of the event.
        eventName:
          type: string
          description: The name of the event.
        eventDate:
          type: string
          description: The date of the event.
        eventPlayers:
          type: number
          description: The number of players in the event.
        playerId:
          type: number
          description: The Longshanks ID of the player.
        playerName:
          type: string
          description: The name of the player.
        rank:
          type: number
          description: The final rank in the event.
          nullable: true
        eventWins:
          type: number
          description: The wins of the player in the event.
          nullable: true
        eventLosses:
          type: number
          description: The losses of the player in the event.
          nullable: true
        games:
          type: number
          description: The games played with this list.
        wins:
          type: number
          description: The games won with this list.
        casterImageUrl:
          type: string
          description: The picture of the caster from the wiki.
          nullable: true
        format:
          type: string
          description: The game format.
          nullable: true
        rawText:
          type: string
          description: The list as submitted.
        commandCards:
          description: The command cards.
          type: array
          items:
            type: string
        warnings:
          description: Problems found while parsing.
          type: array
          items:
            type: string
        entries:
          description: The entries.
          type: array
          items:
            $ref: "#/components/schemas/ListEntryDto"
        playedGames:
          description: The games played with this list.
          type: array
          items:
            $ref: "#/components/schemas/ListGameDto"
        products:
          description: The cheapest products that contain the models of the list.
          type: array
          items:
            $ref: "#/components/schemas/ListProductDto"
        unpricedModels:
          description: Models of the list that are not sold in the shop.
          type: array
          items:
            type: string
      required:
        - id
        - title
        - faction
        - army
        - caster
        - pointLevel
        - totalPoints
        - price
        - currency
        - eventId
        - eventName
        - eventDate
