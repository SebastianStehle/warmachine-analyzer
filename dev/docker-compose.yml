services:
  postgresql:
    image: postgres:17
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=analyzer
    ports:
      - '5010:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d analyzer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
